apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  annotations:
    gateway.networking.k8s.io/generator: ingress2gateway-dev
  labels:
    app.kubernetes.io/managed-by: ingress2gateway
    ingress2gateway.io/source: nginx-virtualserver
  name: nginx
  namespace: default
spec:
  gatewayClassName: nginx
  listeners:
  - hostname: platform.example.com
    name: http-80-platform-example-com
    port: 80
    protocol: HTTP
  - hostname: platform.example.com
    name: https-443-platform-example-com-platform-tls
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - group: ""
        kind: Secret
        name: platform-tls
      mode: Terminate
status: {}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gateway.networking.k8s.io/generator: ingress2gateway-dev
  labels:
    app.kubernetes.io/managed-by: ingress2gateway
    ingress2gateway.io/source: nginx-virtualserver
    ingress2gateway.io/vs-name: multi-vsr-vs
  name: multi-vsr-vs-httproute
  namespace: default
spec:
  hostnames:
  - platform.example.com
  parentRefs:
  - name: nginx
    sectionName: http-80-platform-example-com
  - name: nginx
    sectionName: https-443-platform-example-com-platform-tls
  rules:
  - backendRefs:
    - name: frontend-service
      port: 3000
    matches:
    - path:
        type: PathPrefix
        value: /
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/users
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/users/cache
  - matches:
    - headers:
      - name: X-User-ID
        type: RegularExpression
        value: .*
      path:
        type: PathPrefix
        value: /api/v1/users/profile
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/users/profile
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/orders
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/orders/payment
  - matches:
    - headers:
      - name: X-Beta-Access
        type: RegularExpression
        value: (?i)^enabled$
      path:
        type: PathPrefix
        value: /api/v2/beta
  - matches:
    - path:
        type: PathPrefix
        value: /api/v2/beta
  - matches:
    - path:
        type: PathPrefix
        value: /admin/dashboard
  - matches:
    - headers:
      - name: Authorization
        type: RegularExpression
        value: Bearer .*
      - name: X-Admin-Role
        type: RegularExpression
        value: admin|superadmin
      path:
        type: PathPrefix
        value: /admin/users
  - filters:
    - requestRedirect:
        hostname: auth.example.com
        path:
          replaceFullPath: /admin
          type: ReplaceFullPath
        scheme: https
        statusCode: 302
      type: RequestRedirect
    matches:
    - path:
        type: PathPrefix
        value: /admin/users
status:
  parents: null
